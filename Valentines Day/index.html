<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Bouquet</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  background: radial-gradient(circle at 50% 20%, #2b0033, #0b0015 70%);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', sans-serif;
  overflow:hidden;
  color:white;
}

/* TITLE */
h1{
  position:absolute;
  top:40px;
  font-weight:300;
  letter-spacing:4px;
  text-shadow:0 0 20px #ff4da6;
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #ff4da6; }
  to{ text-shadow:0 0 30px #ff80bf; }
}

.field{
  position:relative;
  width:100%;
  max-width:900px;
  height:500px;
}

/* FLOWER */
.flower{
  position:absolute;
  bottom:0;
  transform-origin:bottom center;
  animation:sway 5s ease-in-out infinite;
}

/* WIND */
@keyframes sway {
  0%   { transform: rotate(0deg); }
  50%  { transform: rotate(4deg); }
  100% { transform: rotate(0deg); }
}

/* STEM */
.stem{
  width:4px;
  height:220px;
  background:linear-gradient(to top,#145214,#66bb6a);
  margin:auto;
  border-radius:10px;
  position:relative;
}

/* LEAVES */
.leaf{
  position:absolute;
  width:55px;
  height:28px;
  background:linear-gradient(135deg,#1b5e20,#81c784);
  border-radius:50%;
}

.leaf.left{
  left:-50px;
  top:120px;
  transform:rotate(-35deg);
}

.leaf.right{
  right:-50px;
  top:150px;
  transform:rotate(35deg);
}

/* BLOOM */
.bloom{
  position:absolute;
  top:-50px;
  left:50%;
  transform:translateX(-50%);
  width:90px;
  height:90px;
}

/* PETALS */
.petal{
  position:absolute;
  width:70px;
  height:70px;
  background: radial-gradient(circle at 30% 30%, #ffb6d9, #ff4da6);
  border-radius:50%;
  box-shadow:0 0 25px rgba(255,0,128,0.6);
  animation:pulse 3s infinite ease-in-out;
}

@keyframes pulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.05); }
  100%{ transform:scale(1); }
}

.p1{ top:0; left:10px; }
.p2{ top:10px; left:-10px; }
.p3{ top:10px; right:-10px; }
.p4{ bottom:-10px; left:10px; }
.p5{ top:25px; left:25px; transform:scale(0.8); }

.center{
  position:absolute;
  width:30px;
  height:30px;
  background:#fff176;
  border-radius:50%;
  top:30px;
  left:30px;
  box-shadow:0 0 25px rgba(255,255,150,0.8);
}

/* BOUQUET POSITIONS (10 FLOWERS) */
.f1{ left:30%; transform:scale(1.2); animation-duration:6s; }
.f2{ left:35%; transform:scale(1.1); animation-duration:5s; }
.f3{ left:40%; animation-duration:7s; }
.f4{ left:45%; transform:scale(1.15); animation-duration:5.5s; }
.f5{ left:50%; transform:scale(1.3); animation-duration:6.5s; }
.f6{ left:55%; animation-duration:5s; }
.f7{ left:60%; transform:scale(1.1); animation-duration:7s; }
.f8{ left:65%; transform:scale(1.05); animation-duration:6s; }
.f9{ left:70%; transform:scale(1.15); animation-duration:5.5s; }
.f10{ left:75%; transform:scale(1.25); animation-duration:6.5s; }

/* SPARKLES */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  opacity:0.6;
  animation: float 8s linear infinite;
}

@keyframes float{
  from{ transform:translateY(0); opacity:0.8; }
  to{ transform:translateY(-500px); opacity:0; }
}

</style>
</head>

<body>

<h1>Happy Valentine's Day 💖</h1>

<div class="field">

<!-- FLOWER TEMPLATE (REPEATED 10 TIMES) -->
<!-- I compacted structure to keep file clean -->

<script>
const field = document.querySelector('.field');

function createFlower(className){
  const flower = document.createElement('div');
  flower.className = 'flower ' + className;
  flower.innerHTML = `
    <div class="stem">
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>
    <div class="bloom">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="center"></div>
    </div>
  `;
  field.appendChild(flower);
}

for(let i=1;i<=10;i++){
  createFlower("f"+i);
}

/* Sparkles */
for(let i=0;i<30;i++){
  let p = document.createElement('div');
  p.classList.add('particle');
  p.style.left = Math.random()*100 + "%";
  p.style.bottom = "0px";
  p.style.animationDuration = (5 + Math.random()*5) + "s";
  p.style.animationDelay = Math.random()*5 + "s";
  field.appendChild(p);
}
</script>

</div>

</body>
</html>
